name: Branch policy

# Runs on every pull request, including the ones into dev where it has nothing to
# check. That is deliberate: a required status check has to be reported on every
# PR, or the ones it never runs for sit at "Expected" and can't be merged at all.
on:
  pull_request:
  # The release workflow dispatches this onto the Version Packages PR it opens
  # against dev, which GitHub would otherwise run no workflows for.
  workflow_dispatch:

concurrency:
  group: branch-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base:
    name: PR base
    runs-on: ubuntu-latest
    steps:
      # The default branch is main, so that is what GitHub pre-fills as the base
      # for a new PR, and feature work aimed at dev lands one dropdown away from
      # going straight to production. Nothing else catches that: the diff looks
      # right, CI passes, and it only shows up as a release nobody meant to cut.
      #
      # Only dev may open a PR into main, with no exceptions. A hotfix goes
      # through dev like anything else, or the next dev -> main PR quietly
      # reverts it; and the version commit is made on dev too (see release.yml),
      # which is what keeps main from ever holding something dev does not.
      - name: Check the base branch
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" != 'main' ]; then
            echo "Base is ${BASE:-not a PR (dispatched)}. Nothing to check."
            exit 0
          fi
          if [ "$HEAD" != 'dev' ]; then
            echo "::error::'$HEAD' cannot open a pull request into main. Re-target this PR at dev: gh pr edit <number> --base dev"
            exit 1
          fi
          echo "dev -> main is allowed."

      - uses: actions/checkout@v7
        if: github.base_ref == 'main'

      # Merging into main publishes, so dev has to arrive released: a changeset
      # still pending means the Version Packages PR on dev has not been merged,
      # and main would deploy registry code that imports a package version
      # nobody can install yet.
      - name: Check that dev is versioned
        if: github.base_ref == 'main'
        run: |
          pending=$(find .changeset -name '*.md' ! -name README.md)
          if [ -n "$pending" ]; then
            echo "::error::dev has unversioned changesets: $(echo $pending). Merge the open \"chore: version packages\" PR into dev first; this check re-runs when dev moves."
            exit 1
          fi
          echo "No pending changesets."
