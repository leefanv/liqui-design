name: Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Page checks
    runs-on: ubuntu-latest
    # Playwright's own image, purely because it ships the browser and its system
    # libraries ready to run. Nothing here compares pixels, so the tag no longer
    # has to match anything — bump it with the dependency.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turbo builds packages/glass first. Playwright will build again through
      # its webServer, but that run is cached and this fails fast and legibly
      # if the workspace itself is broken.
      - run: pnpm build
      # Console errors, layout invariants and filter-cache behaviour. The
      # screenshot suite (e2e/visual.spec.ts) is a local tool and is not run
      # here — see CONTRIBUTING.
      - run: pnpm --filter www test:checks
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: apps/www/playwright-report
          retention-days: 14
