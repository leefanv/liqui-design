name: Visual

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Glass screenshots
    runs-on: ubuntu-latest
    # Pinned to the same image the baselines are generated in. Glass is a
    # per-pixel canvas render fed through an SVG filter, so it is sensitive to
    # the graphics stack in a way ordinary DOM screenshots are not — running on
    # a bare runner would drift from local baselines constantly.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turbo builds packages/glass first. Playwright will build again through
      # its webServer, but that run is cached and this fails fast and legibly
      # if the workspace itself is broken.
      - run: pnpm build
      - run: pnpm --filter www test:visual
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/www/playwright-report
          retention-days: 14
